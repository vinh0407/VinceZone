<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Đang khởi động VinceZone Studio...</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #09090b;
      color: #fafafa;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      user-select: none;
      overflow: hidden;
    }
    .splash-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 2.5rem;
      border-radius: 16px;
      background: rgba(24, 24, 27, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      max-width: 420px;
      width: 90%;
    }
    .splash-logo {
      width: 72px;
      height: 72px;
      border-radius: 18px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 0 35px rgba(255, 255, 255, 0.2);
      margin-bottom: 1.25rem;
      animation: pulseGlow 2s infinite ease-in-out;
    }
    .splash-logo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    @keyframes pulseGlow {
      0%, 100% { transform: scale(1); box-shadow: 0 0 25px rgba(37, 99, 235, 0.4); }
      50% { transform: scale(1.05); box-shadow: 0 0 45px rgba(99, 102, 241, 0.6); }
    }
    .splash-title {
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 0.35rem;
    }
    .splash-subtitle {
      font-size: 0.85rem;
      color: #a1a1aa;
      margin-bottom: 1.75rem;
    }
    .splash-spinner {
      width: 28px;
      height: 28px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 1rem;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .splash-status {
      font-size: 0.8rem;
      color: #71717a;
    }
  </style>
</head>
<body>
  <div class="splash-card">
    <div class="splash-logo"><img src="logo.png" alt="VinceZone Logo"></div>
    <div class="splash-title">VinceZone Studio</div>
    <div class="splash-subtitle">AI Workplay &amp; Autonomous IDE [Desktop]</div>
    <div class="splash-spinner"></div>
    <div id="splash-status" class="splash-status">Đang khởi động dịch vụ AI &amp; Gateway...</div>
  </div>
</body>
</html>
